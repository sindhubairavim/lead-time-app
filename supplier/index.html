<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Portal - Supplier Lead Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{
    --page:#efefef; --white:#fff; --ink:#222; --ink2:#5f5f5f; --ink3:#8d8d8d;
    --line:#d9d9d9; --line2:#e6e6e6; --blue:#2b5fc9; --blue-bg:#e6eefb;
    --edit:#fbf0d3; --calc:#f4f4f4; --sel:#e9f1ec; --hover:#f5f5f5; --green:#2e8b57; --red:#d93025;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Roboto,-apple-system,"Segoe UI",Arial,sans-serif;font-size:13px;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
  button,select{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  i.ti{line-height:1}

  .app{display:grid;grid-template-columns:42px 1fr 42px;grid-template-rows:40px 1fr;height:100vh;min-height:520px}
  .rail{display:flex;flex-direction:column;align-items:center;padding-bottom:10px}
  .rail i.ti{font-size:20px;color:var(--ink2)}
  .rail-left{grid-column:1;grid-row:1/3}
  .rail-right{grid-column:3;grid-row:2}
  .logo{width:28px;height:28px;margin:6px 0 0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;letter-spacing:-.6px}
  .rail-left .icons{display:flex;flex-direction:column;gap:21px;margin-top:20px}
  .rail-right .icons{display:flex;flex-direction:column;gap:27px;margin-top:20px}
  .rail .bottom{margin-top:auto}

  .top{grid-column:2/4;grid-row:1;background:var(--white);display:flex;align-items:center;gap:6px;padding:0 5px 0 6px;min-width:0}
  .back{width:22px;height:28px;border:1px solid var(--line);background:#f5f5f5;display:flex;align-items:center;justify-content:center;padding:0;margin-right:4px}
  .back i.ti{font-size:16px;color:var(--ink2)}
  .portal{font-size:17px;font-weight:500;padding:0 14px 0 4px;white-space:nowrap}
  .tabs{display:flex;height:100%;align-self:stretch}
  .tabs button{background:none;border:none;border-radius:0;padding:0 21px;font-size:15px;color:var(--ink2);height:100%;white-space:nowrap}
  .tabs button:hover{background:#f6f6f6}
  .tabs button[aria-selected="true"]{background:var(--page);color:var(--ink);font-weight:500}
  .tabs button:focus-visible{outline-offset:-3px}
  .grow{flex:1}
  .ib{background:none;border:none;padding:6px;display:flex;position:relative;border-radius:2px}
  .ib:hover{background:var(--hover)}
  .ib i.ti{font-size:20px;color:var(--ink2)}
  .ib.hl{border:2px solid #000;padding:4px;margin:0 6px}
  .ib.hl i.ti{color:#000}
  .badge{position:absolute;top:-1px;right:-3px;background:#c62828;color:#fff;border-radius:9px;font-size:10px;font-weight:500;line-height:1;padding:3px 5px}
  .env{display:flex;align-items:center;gap:4px;background:#3a9d48;color:#fff;border-radius:12px;padding:2px 2px 2px 7px;font-size:11px;height:20px;margin:0 6px}
  .env b{font-weight:400;background:#fff;color:var(--ink);border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-size:9.5px;border:1px solid #ccc}
  .avatar{background:#5b8f6c;color:#fff;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}

  .main{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:6px;padding:4px 0 6px;min-width:0;min-height:0}
  .filters{background:var(--white);display:flex;align-items:center;gap:16px;padding:0 12px 0 6px;height:30px;flex:none;font-size:14px;overflow:hidden;white-space:nowrap}
  .tg{width:20px;height:22px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .tg i.ti,.fn i.ti{font-size:17px;color:var(--ink2)}
  .fn{padding:0 2px 0 8px;display:flex}
  .f{display:flex;align-items:center;gap:6px}
  .f .v{background:var(--page);padding:2px 8px;display:flex;gap:10px;height:22px;align-items:center}
  .f .v em{font-style:normal;color:var(--ink3)}
  .filters .end{margin-left:auto;display:flex;gap:10px}
  .filters .end i.ti{font-size:18px;color:var(--ink2)}

  .panel{background:var(--white);flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 7px 7px;min-width:0}
  .tabrow{display:flex;align-items:center;gap:2px;height:36px;flex:none}
  .title{font-size:15px;padding:0 10px;height:100%;display:flex;align-items:center;border-bottom:1px solid #333;margin-right:auto;white-space:nowrap}
  .tb{display:flex;align-items:center;gap:5px;background:none;border:none;padding:6px 8px;font-size:15px;white-space:nowrap}
  .tb:hover{background:var(--hover)}
  .tb i.ti{font-size:18px}
  .tb .chev{font-size:13px;color:var(--ink2)}
  .vsep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .tb.pic{padding:6px 5px}
  .tb.pic i.ti{color:var(--ink2);font-size:17px}
  .metric{display:flex;align-items:center;gap:8px;font-size:14px;margin-right:6px}
  .metric select{font-size:14px;height:26px;border:1px solid var(--line);background:#f5f5f5;padding:0 6px}

  .infoRow{display:flex;align-items:center;gap:12px;margin:4px 0 6px;font-size:13.5px;flex:none}
  .info{color:var(--blue);display:flex;align-items:center;gap:5px}
  .info i.ti{font-size:15px}
  .verchip{margin-left:auto;color:var(--ink2)}
  .verchip b{font-weight:500;color:var(--ink)}

  .gridwrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);background:var(--white)}
  .grid{display:flex;flex-direction:column;min-height:100%}
  .hd{display:grid;grid-template-columns:var(--cols);grid-template-rows:22px auto;flex:none;border-bottom:1px solid #b9b9b9}
  .h{padding:0 8px;font-size:14px;border-right:1px solid var(--line2);display:flex;align-items:flex-end;min-height:22px;line-height:21px;white-space:nowrap;overflow:hidden;background:var(--white)}
  .h.sp{justify-content:space-between}
  .h.num{justify-content:flex-end;text-align:right}
  .h.ed{font-style:italic;font-weight:500}
  .h.grp{align-items:center;border-bottom:1px solid var(--line2);font-weight:500}
  .h.ver{flex-direction:column;align-items:flex-end;justify-content:flex-end;padding:3px 8px 2px;line-height:1.25}
  .h.ver .vn{font-size:14px;font-weight:500}
  .h.ver .vs{font-size:11px;color:var(--ink2)}
  .h.cur{background:var(--blue-bg)}
  .h.cur .vs{color:var(--blue)}
  .h .ti{font-size:13px;color:var(--ink3)}

  #bd{display:flex;flex-direction:column;flex:1}
  .row{display:grid;grid-template-columns:var(--cols);height:22px;flex:none}
  .row.filler{flex:1;height:auto}
  .row.filler .c{border-bottom:none}
  .c{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 8px;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .c.num{text-align:right;font-variant-numeric:tabular-nums}
  .c.ic{display:flex;align-items:center;justify-content:center;gap:6px;padding:0}
  .c.ic .ti{font-size:14px;color:var(--ink2)}
  .c.calc{background:var(--calc)}
  .row[data-i]:hover .c{background:var(--hover)}
  .row.sel .c{background:var(--sel)}
  .row.sel > .c:first-child{box-shadow:inset 0 0 0 2px #444}
  .c.cur{background:#f7faff}
  .row[data-i]:hover .c.cur{background:#eef3fb}
  .row.sel .c.cur{background:var(--sel)}
  .c.ed{background:var(--edit)!important;padding:0}
  .c.ed input{width:100%;height:21px;border:none;background:transparent;text-align:right;padding:0 8px;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
  .c.ed input::-webkit-outer-spin-button,.c.ed input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .c.ed input:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .c.ed input.bad{outline:2px solid var(--red);outline-offset:-2px}
  .flag{display:block}
  .dash{display:inline-block;width:11px;height:2px;background:var(--ink3)}

  .legend{display:flex;align-items:center;gap:20px;margin-top:8px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap;min-height:20px;flex:none}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend .sw{width:14px;height:12px;display:inline-block;border:1px solid var(--line)}
  #msg{margin-left:auto;font-size:13px}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <nav class="rail rail-left" aria-label="Primary">
    <div class="logo" aria-label="o9">o9</div>
    <div class="icons">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
      <i class="ti ti-layout-grid" aria-hidden="true"></i>
      <i class="ti ti-device-desktop" aria-hidden="true"></i>
      <i class="ti ti-user-cog" aria-hidden="true"></i>
    </div>
    <i class="ti ti-list-details bottom" aria-hidden="true"></i>
  </nav>

  <header class="top">
    <button class="back" aria-label="Back"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
    <span class="portal">Supplier Portal</span>
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-entry" data-view="entry" aria-selected="true">Supplier Lead Time</button>
      <button role="tab" id="tab-history" data-view="history" aria-selected="false" tabindex="-1">History</button>
    </div>
    <span class="grow"></span>
    <button class="ib" aria-label="Upload"><i class="ti ti-cloud-upload" aria-hidden="true"></i></button>
    <button class="ib" aria-label="Download"><i class="ti ti-cloud-download" aria-hidden="true"></i></button>
    <button class="ib" aria-label="Export to Excel"><i class="ti ti-file-spreadsheet" aria-hidden="true"></i></button>
    <button class="ib" aria-label="Layouts"><i class="ti ti-layout-list" aria-hidden="true"></i></button>
    <button class="ib" aria-label="Comments"><i class="ti ti-message-circle" aria-hidden="true"></i></button>
    <button class="ib" aria-label="Notifications, 16 unread"><i class="ti ti-bell" aria-hidden="true"></i><span class="badge">16</span></button>
    <button class="ib" aria-label="Refresh"><i class="ti ti-refresh" aria-hidden="true"></i></button>
    <button class="ib" aria-label="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>
    <button class="ib hl" aria-label="Settings"><i class="ti ti-settings" aria-hidden="true"></i></button>
    <span class="env">Preprod<b>VC</b></span>
    <span class="avatar" title="Supplier user">SM</span>
  </header>

  <main class="main">
    <div class="filters">
      <span class="tg"><i class="ti ti-layout-sidebar" aria-hidden="true"></i></span>
      <span class="fn"><i class="ti ti-filter" aria-hidden="true"></i></span>
      <div class="f"><span>Location</span><span class="v">(All) <em>3</em></span></div>
      <div class="f"><span>Supplier</span><span class="v">CASIL Semiconductor Ltd</span></div>
      <div class="f"><span>Version Name</span><span class="v">CurrentWorkingView</span></div>
      <div class="end">
        <i class="ti ti-star" aria-hidden="true"></i>
        <i class="ti ti-share" aria-hidden="true"></i>
        <i class="ti ti-dots-vertical" aria-hidden="true"></i>
      </div>
    </div>

    <section class="panel">
      <div class="tabrow">
        <div class="title" id="tabTitle">Supplier Provided Lead Time</div>
        <label class="metric hide" id="metricWrap">Lead Time
          <select id="metricSel" aria-label="Lead time to display"></select>
        </label>
        <button class="tb" id="saveBtn"><i class="ti ti-device-floppy" aria-hidden="true"></i>Save Lead Time</button>
        <span class="vsep" id="saveSep"></span>
        <button class="tb"><i class="ti ti-download" aria-hidden="true"></i>Download<i class="ti ti-chevron-down chev" aria-hidden="true"></i></button>
        <button class="tb"><i class="ti ti-filter" aria-hidden="true"></i>Filters<i class="ti ti-chevron-down chev" aria-hidden="true"></i></button>
        <button class="tb pic" aria-label="Extensions"><i class="ti ti-puzzle" aria-hidden="true"></i></button>
        <button class="tb">Layout</button>
        <button class="tb pic" aria-label="Pin"><i class="ti ti-pin" aria-hidden="true"></i></button>
        <button class="tb pic" aria-label="Collapse"><i class="ti ti-arrows-minimize" aria-hidden="true"></i></button>
      </div>

      <div class="infoRow">
        <div class="info"><i class="ti ti-info-circle-filled" aria-hidden="true"></i><span id="infoTxt"></span></div>
        <div class="verchip" id="verChip"></div>
      </div>

      <div class="gridwrap">
        <div class="grid" id="grid" role="table">
          <div class="hd" id="hd" role="rowgroup"></div>
          <div id="bd" role="rowgroup"></div>
        </div>
      </div>

      <div class="legend" id="legend">
        <span id="lgSaved"></span>
        <span id="lgUnsaved"></span>
        <span id="lgNone"></span>
        <span><i class="sw" style="background:var(--edit)"></i>Editable</span>
        <span><i class="sw" style="background:var(--calc)"></i>Calculated by the application</span>
        <span id="msg" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <nav class="rail rail-right" aria-label="Tools">
    <div class="icons">
      <i class="ti ti-layout-sidebar-right" aria-hidden="true"></i>
      <i class="ti ti-settings" aria-hidden="true"></i>
      <i class="ti ti-circle-dot" aria-hidden="true"></i>
      <i class="ti ti-help-circle" aria-hidden="true"></i>
    </div>
    <i class="ti ti-chevron-right bottom" aria-hidden="true"></i>
  </nav>
</div>

<script>
(function(){
  var TODAY='06-10-2026', USER='S. Mehta';
  var VENDOR='CASIL Semiconductor Ltd';
  var N=null;

  var STAGES=['Raw Material Procurement','Manufacturing','Shipment Preparation','Transit'];
  var FORMULA_COLD='Raw Material Procurement + Manufacturing + Shipment Preparation + Transit';
  var FORMULA_REPL='Manufacturing + Shipment Preparation + Transit';

  var rows=[
    {ship:'5100',item:'200-160-001',  h:[[12,8,2,3],[12,8,2,3],[14,8,2,3],[14,8,2,3],[14,8,2,3]]},
    {ship:'5100',item:'32308239-001', h:[[20,12,3,3],[20,10,2,3],[20,10,2,3],[20,10,2,3],[20,10,2,3]]},
    {ship:'5500',item:'32308239-001', h:[[N,N,N,N],[N,N,N,N],[18,12,3,6],[18,12,3,6],[18,12,3,7]]},
    {ship:'5500',item:'50001535-001', h:[[N,N,N,N],[N,N,N,N],[N,N,N,N],[7,5,1,4],[7,5,1,4]]},
    {ship:'5515',item:'200-160-001',  h:[[30,18,3,7],[30,18,3,7],[30,18,3,7],[32,18,3,7],[30,18,3,7]]},
    {ship:'5515',item:'50001535-001', h:[[N,N,N,N],[N,N,N,N],[N,N,N,N],[N,N,N,N],[N,N,N,N]]}
  ];
  var meta=[
    {d:'28-09-2026',by:'S. Mehta'},
    {d:'29-09-2026',by:'S. Mehta'},
    {d:'30-09-2026',by:'A. Rao'},
    {d:'03-10-2026',by:'S. Mehta'},
    {d:'06-10-2026',by:'S. Mehta'}
  ];
  var versions=meta.map(function(m,k){
    return {n:k+1,d:m.d,by:m.by,s:rows.map(function(r){return r.h[k].slice()})};
  });
  function cur(){return versions[versions.length-1]}
  var draft=cur().s.map(function(a){return a.slice()});
  var view='entry';
  var selected=0;
  var metric='cold';

  function repl(a){return (a[1]!==N&&a[2]!==N&&a[3]!==N)?a[1]+a[2]+a[3]:N}
  function cold(a){var r=repl(a);return (r!==N&&a[0]!==N)?r+a[0]:N}
  var METRICS=[
    {k:'cold',name:'Cold Start',fn:cold},
    {k:'repl',name:'Replenishment',fn:repl},
    {k:'rm',name:STAGES[0],fn:function(a){return a[0]}},
    {k:'mfg',name:STAGES[1],fn:function(a){return a[1]}},
    {k:'ship',name:STAGES[2],fn:function(a){return a[2]}},
    {k:'tr',name:STAGES[3],fn:function(a){return a[3]}}
  ];
  function metricObj(){return METRICS.filter(function(m){return m.k===metric})[0]}

  var G='#2e8b57', R='#d93025';
  function flag(c){
    return '<svg class="flag" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/><path d="M5 4h14l-3.5 4.5L19 13H5z" fill="'+c+'"/></svg>';
  }
  var DASH='<span class="dash"></span>';
  var ACT='<i class="ti ti-dots" aria-hidden="true"></i><i class="ti ti-menu-2" aria-hidden="true"></i>';
  function $(id){return document.getElementById(id)}
  function num(v){return v===N?DASH:String(Math.round(v*100)/100)}

  $('lgSaved').innerHTML=flag(G)+'Saved in current version';
  $('lgUnsaved').innerHTML=flag(R)+'Edited, not saved yet';
  $('lgNone').innerHTML=DASH+'No value';

  var sel=$('metricSel');
  METRICS.forEach(function(m){var o=document.createElement('option');o.value=m.k;o.textContent=m.name;sel.appendChild(o)});
  sel.addEventListener('change',function(){metric=sel.value;buildHistory()});

  function setCols(cols){
    var g=$('grid');
    g.style.setProperty('--cols',cols.map(function(w){return w+'px'}).join(' '));
    g.style.width=cols.reduce(function(a,b){return a+b},0)+'px';
  }
  function filler(n){
    var s='<div class="row filler" role="row">';
    for(var i=0;i<n;i++) s+='<div class="c"></div>';
    return s+'</div>';
  }

  function rowDirty(i){
    for(var s=0;s<4;s++){ if(draft[i][s]!==cur().s[i][s]) return true; }
    return false;
  }
  function rowEmpty(i){
    for(var s=0;s<4;s++){ if(draft[i][s]!==N) return false; }
    return true;
  }
  function status(i){
    if(rowDirty(i)) return 'dirty';
    return rowEmpty(i)?'none':'saved';
  }
  function dirtyCount(){
    var n=0; for(var i=0;i<rows.length;i++){ if(rowDirty(i)) n++; } return n;
  }

  function updateFlags(){
    for(var i=0;i<rows.length;i++){
      var cell=$('f'+i); if(!cell) return;
      var s=status(i);
      cell.innerHTML = s==='dirty'?flag(R) : s==='saved'?flag(G) : DASH;
      cell.title = s==='dirty'?'Edited, not saved yet' : s==='saved'?'Saved in V'+cur().n : 'No value';
      $('tc'+i).innerHTML=num(cold(draft[i]));
      $('tr'+i).innerHTML=num(repl(draft[i]));
    }
    updateInfo();
  }

  function updateInfo(){
    var c=cur();
    if(view==='entry'){
      var n=dirtyCount();
      $('infoTxt').textContent='Showing '+rows.length+' rows of data.'+(n?' '+n+' unsaved '+(n===1?'change':'changes')+'.':'');
      $('verChip').innerHTML='Current version: <b>V'+c.n+'</b>, saved '+c.d+' by '+c.by;
    }else{
      var shown=Math.min(5,versions.length);
      $('infoTxt').textContent='Showing '+rows.length+' rows of data across the latest '+shown+' of '+versions.length+' versions. Lead time in days.';
      $('verChip').innerHTML='';
    }
  }

  function buildEntry(){
    var cols=[56,64,90,190,130,195,125,170,90,100,130];
    setCols(cols);
    var h='';
    h+='<div class="h" style="grid-row:1/span 2;grid-column:1;justify-content:center;padding:0;gap:4px"><i class="ti ti-player-track-prev" aria-hidden="true"></i><i class="ti ti-player-track-next" aria-hidden="true"></i></div>';
    h+='<div class="h" style="grid-row:1/span 2;grid-column:2;justify-content:center">Status</div>';
    h+='<div class="h" style="grid-row:1/span 2;grid-column:3">Ship To</div>';
    h+='<div class="h sp" style="grid-row:1/span 2;grid-column:4">Vendor<i class="ti ti-arrow-up" aria-hidden="true"></i></div>';
    h+='<div class="h" style="grid-row:1/span 2;grid-column:5">Item</div>';
    h+='<div class="h grp" style="grid-row:1;grid-column:6 / span 4">Supplier Lead Time by Stage (Days)</div>';
    h+='<div class="h grp" style="grid-row:1;grid-column:10 / span 2">Total Lead Time (Days)</div>';
    STAGES.forEach(function(n,k){h+='<div class="h num ed" style="grid-row:2;grid-column:'+(6+k)+'">'+n+'</div>'});
    h+='<div class="h num" style="grid-row:2;grid-column:10" title="'+FORMULA_COLD+'">Cold Start</div>';
    h+='<div class="h num" style="grid-row:2;grid-column:11" title="'+FORMULA_REPL+'">Replenishment</div>';
    $('hd').innerHTML=h;

    var b='';
    rows.forEach(function(r,i){
      b+='<div class="row'+(i===selected?' sel':'')+'" data-i="'+i+'" role="row">'+
        '<div class="c ic" role="cell">'+ACT+'</div>'+
        '<div class="c ic" id="f'+i+'" role="cell"></div>'+
        '<div class="c" role="cell">'+r.ship+'</div>'+
        '<div class="c" role="cell" title="'+VENDOR+'">'+VENDOR+'</div>'+
        '<div class="c" role="cell">'+r.item+'</div>';
      for(var s=0;s<4;s++){
        var v=draft[i][s];
        b+='<div class="c ed" role="cell"><input type="number" min="0" step="1" data-i="'+i+'" data-s="'+s+'" id="i'+i+'_'+s+'" aria-label="'+STAGES[s]+' lead time in days for item '+r.item+' shipping to '+r.ship+'" value="'+(v===N?'':v)+'"></div>';
      }
      b+='<div class="c calc num" id="tc'+i+'" role="cell" title="'+FORMULA_COLD+'"></div>'+
         '<div class="c calc num" id="tr'+i+'" role="cell" title="'+FORMULA_REPL+'"></div></div>';
    });
    $('bd').innerHTML=b+filler(cols.length);
    $('bd').querySelectorAll('input').forEach(function(inp){
      inp.addEventListener('input',function(){
        var i=+inp.dataset.i, s=+inp.dataset.s;
        draft[i][s]=inp.value===''?N:Number(inp.value);
        inp.classList.toggle('bad',draft[i][s]!==N&&draft[i][s]<0);
        $('msg').textContent='';
        updateFlags();
      });
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          var nx=$('i'+(+inp.dataset.i+1)+'_'+inp.dataset.s); if(nx){nx.focus();nx.select();}
          e.preventDefault();
        }
      });
    });
    updateFlags();
  }

  function buildHistory(){
    var last=versions.slice(-5);
    var m=metricObj();
    var cols=[56,90,190,130]; last.forEach(function(){cols.push(130)});
    setCols(cols);
    var K=4, V=last.length;
    var h='';
    h+='<div class="h" style="grid-row:1/span 2;grid-column:1;justify-content:center;padding:0;gap:4px"><i class="ti ti-player-track-prev" aria-hidden="true"></i><i class="ti ti-player-track-next" aria-hidden="true"></i></div>';
    h+='<div class="h" style="grid-row:1/span 2;grid-column:2">Ship To</div>';
    h+='<div class="h sp" style="grid-row:1/span 2;grid-column:3">Vendor<i class="ti ti-arrow-up" aria-hidden="true"></i></div>';
    h+='<div class="h" style="grid-row:1/span 2;grid-column:4">Item</div>';
    h+='<div class="h grp" style="grid-row:1;grid-column:'+(K+1)+' / span '+V+'">'+m.name+' Lead Time (Days)</div>';
    last.forEach(function(v,k){
      var isCur=k===last.length-1;
      h+='<div class="h ver'+(isCur?' cur':'')+'" style="grid-row:2;grid-column:'+(K+1+k)+'"><span class="vn">V'+v.n+(isCur?' (current)':'')+'</span><span class="vs">'+v.d+', '+v.by+'</span></div>';
    });
    $('hd').innerHTML=h;
    var b='';
    rows.forEach(function(r,i){
      b+='<div class="row'+(i===selected?' sel':'')+'" data-i="'+i+'" role="row">'+
        '<div class="c ic" role="cell">'+ACT+'</div>'+
        '<div class="c" role="cell">'+r.ship+'</div>'+
        '<div class="c" role="cell" title="'+VENDOR+'">'+VENDOR+'</div>'+
        '<div class="c" role="cell">'+r.item+'</div>';
      last.forEach(function(v,k){
        var isCur=k===last.length-1;
        b+='<div class="c num'+(isCur?' cur':'')+'" role="cell">'+num(m.fn(v.s[i]))+'</div>';
      });
      b+='</div>';
    });
    $('bd').innerHTML=b+filler(cols.length);
    updateInfo();
  }

  function setView(v){
    view=v;
    var isEntry=v==='entry';
    document.title='Supplier Portal - '+(isEntry?'Supplier Lead Time':'History');
    $('tabTitle').textContent=isEntry?'Supplier Provided Lead Time':'Supplier Provided Lead Time History';
    ['saveBtn','saveSep','legend'].forEach(function(id){$(id).classList.toggle('hide',!isEntry)});
    $('metricWrap').classList.toggle('hide',isEntry);
    $('msg').textContent='';
    document.querySelectorAll('.tabs button').forEach(function(b){
      var on=b.dataset.view===v;
      b.setAttribute('aria-selected',on?'true':'false');
      b.tabIndex=on?0:-1;
    });
    if(isEntry) buildEntry(); else buildHistory();
  }

  function save(){
    var msg=$('msg');
    for(var i=0;i<draft.length;i++){
      for(var s=0;s<4;s++){
        if(draft[i][s]!==N&&draft[i][s]<0){
          msg.style.color=R; msg.textContent='Lead time can\u2019t be negative. Fix the highlighted cells.'; return;
        }
      }
    }
    if(dirtyCount()===0){
      msg.style.color='var(--ink2)'; msg.textContent='No changes to save. V'+cur().n+' stays current.'; return;
    }
    var next=cur().n+1;
    versions.push({n:next,d:TODAY,by:USER,s:draft.map(function(a){return a.slice()})});
    updateFlags();
    msg.style.color=G; msg.textContent='Saved as version V'+next;
  }
  $('saveBtn').addEventListener('click',save);

  $('bd').addEventListener('click',function(e){
    var r=e.target.closest('.row[data-i]'); if(!r) return;
    selected=+r.dataset.i;
    $('bd').querySelectorAll('.row.sel').forEach(function(x){x.classList.remove('sel')});
    r.classList.add('sel');
  });

  var tabs=document.querySelectorAll('.tabs button');
  tabs.forEach(function(b,idx){
    b.addEventListener('click',function(){ setView(b.dataset.view); });
    b.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        var t=tabs[(idx+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];
        setView(t.dataset.view); t.focus();
      }
    });
  });

  setView('entry');
})();
</script>
</body>
</html>
